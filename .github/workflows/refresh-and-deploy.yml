name: Refresh knowledge & deploy Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate every tracked version
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: knowledge-and-pages
  cancel-in-progress: false
jobs:
  collect-and-build:
    # Manual runs are restricted to the production branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Restore the previous knowledge snapshot
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin knowledge; then
            git fetch origin knowledge:refs/remotes/origin/knowledge
            git restore --source=origin/knowledge --worktree -- public/data public/knowledge
          fi
      - name: Collect repositories, branches, source evidence and trending
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WIKI_API_KEY: ${{ secrets.WIKI_API_KEY }}
          WIKI_API_URL: ${{ vars.WIKI_API_URL || 'https://api.deepseek.com/chat/completions' }}
          WIKI_MODEL: ${{ vars.WIKI_MODEL || 'deepseek-flash' }}
          FORCE_REGENERATE: ${{ inputs.force }}
        shell: bash
        run: |
          if [ "$FORCE_REGENERATE" = "true" ]; then
            node scripts/collect.mjs --force
          else
            npm run collect
          fi
      - run: npm run validate
      - run: npm run build
      - name: Persist generated knowledge on its own branch
        run: node scripts/persist-knowledge.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: collect-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
