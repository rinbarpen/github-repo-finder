name: Refresh knowledge & deploy Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate every tracked version
        type: boolean
        default: false
      repositories:
        description: Comma-separated owner/repo names; leave empty for every repository
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: knowledge-and-pages
  cancel-in-progress: false
jobs:
  collect-and-build:
    # Manual dev runs produce review artifacts; only main can publish the site.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Restore the previous knowledge snapshot
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin knowledge; then
            git fetch origin knowledge:refs/remotes/origin/knowledge
            git restore --source=origin/knowledge --worktree -- public/data public/knowledge
          fi
      - name: Collect repositories, branches, source evidence and trending
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WIKI_API_KEY: ${{ secrets.WIKI_API_KEY }}
          WIKI_API_URL: ${{ vars.WIKI_API_URL || 'https://api.deepseek.com/chat/completions' }}
          WIKI_MODEL: ${{ vars.WIKI_MODEL || 'deepseek-flash' }}
          FORCE_REGENERATE: ${{ inputs.force }}
          SELECTED_REPOSITORIES: ${{ inputs.repositories }}
        shell: bash
        run: |
          args=()
          if [ "$FORCE_REGENERATE" = "true" ]; then args+=(--force); fi
          if [ -n "$SELECTED_REPOSITORIES" ]; then args+=("--repos=$SELECTED_REPOSITORIES"); fi
          node scripts/collect.mjs "${args[@]}"
      - run: npm run validate
      - name: Persist generated knowledge on its own branch
        if: github.ref == 'refs/heads/main'
        run: node scripts/persist-knowledge.mjs
      - name: Require complete architecture guides for the selected repositories
        env:
          SELECTED_REPOSITORIES: ${{ inputs.repositories }}
        shell: bash
        run: |
          node scripts/validate.mjs --require-architecture "--repos=$SELECTED_REPOSITORIES"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
      - name: Upload an architecture preview for review
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: architecture-preview
          path: dist
          retention-days: 7
      - name: Upload source-reading diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-diagnostics
          path: .cache/architecture-review
          if-no-files-found: ignore
          retention-days: 7
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: collect-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
